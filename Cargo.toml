[package]
name = "rust-web-app-frank-resume"
version = "0.1.0"
edition = "2021"

# Bevy is a binary app now — remove the old [lib] crate-type = ["cdylib"] section.

[dependencies]
bevy = "0.15"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Smaller/faster wasm in release (optional but recommended):
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
